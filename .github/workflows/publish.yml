name: Publish

# Automated releases via python-semantic-release. Every push to main is
# evaluated against conventional commits: feat -> minor, fix/perf ->
# patch, "feat!" or a "BREAKING CHANGE" footer -> major (major_on_zero).
# When a release is due the version is stamped (pyproject.toml +
# __version__), a v-tag and GitHub release are created, sdist/wheel go
# to PyPI (OIDC trusted publishing, no tokens) and the runtime image is
# pushed to GHCR with the same tag. No floating tags, no manual bumps.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: markdown-gost:test
          cache-from: type=gha,scope=mg-tests
          cache-to: type=gha,mode=max,scope=mg-tests

      - name: Run full test suite (unit + integration + screenshot)
        run: docker run --rm markdown-gost:test

  release:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
        with:
          print-hash: true

      - name: Upload distributions to the GitHub release
        uses: python-semantic-release/upload-to-gh-release@v9.8.9
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        if: steps.release.outputs.released == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=mg-image
          cache-to: type=gha,mode=max,scope=mg-image
