name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: markdown-gost:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create isolated test network
        run: docker network create mg-test

      - name: Start MinIO for S3 integration tests
        run: |
          docker run -d --name minio --network mg-test --network-alias minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            docker run --rm --network mg-test quay.io/mc/mc:latest \
              alias set local http://minio:9000 minioadmin minioadmin \
              && docker run --rm --network mg-test quay.io/mc/mc:latest \
              mb --ignore-existing local/markdown-gost \
              && break
            sleep 2
          done

      - name: Run full test suite (unit + integration + screenshot)
        run: |
          docker run --rm --network mg-test \
            -e S3_ENDPOINT=http://minio:9000 \
            -e S3_ACCESS_KEY=minioadmin \
            -e S3_SECRET_KEY=minioadmin \
            markdown-gost:test
