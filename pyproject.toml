[project]
name = "markdown-gost"
version = "0.1.0"
description = "Markdown to GOST 7.32 DOCX/PDF converter with an HTML preview engine"
authors = [{ name = "Arseniy Mikheev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "marko (>=2.1.0,<3.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "click (>=8.1.0,<9.0.0)",
    "pygments (>=2.18.0,<3.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "freetype-py (>=2.5.0,<3.0.0)",
    "latex2mathml (>=3.76.0,<4.0.0)",
    "lxml (>=5.0.0,<6.0.0)",
]

[project.optional-dependencies]
pdf = ["unoserver (>=3.0,<4.0)"]
s3 = ["boto3 (>=1.35.0,<2.0.0)"]

[project.scripts]
markdown-gost = "markdown_gost.cli.__main__:cli"

[tool.poetry]
packages = [{ include = "markdown_gost", from = "src" }]
include = [{ path = "src/markdown_gost/render/_assets/*.xsl", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"
mypy = "^1.13.0"
pdf2image = "^1.17.0"
unoserver = "^3.0.0"
types-pyyaml = "^6.0.12"
playwright = "^1.61.0"
# Metric and storage backends stay optional for end users, but the test
# suite asserts their real behaviour.
prometheus-client = ">=0.21.0,<1.0.0"
boto3 = ">=1.35.0,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
