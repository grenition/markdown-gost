# T040 smoke case: дипломная работа 2018 года, типичный «грязный» docx
# из архива МИРЭА. Фикстура input.docx не коммитится — см. ../README.md.
#
# Все пороги — нижние границы того, что должно пережить импорт без паник.
# Не описание идеального вывода, а защита от регрессий пайплайна.
min_chars: 5000
max_fallbacks: 25
must_contain:
  - "Введение"
  - "Заключение"
must_have_at_least:
  headings: 5
  tables: 1
