line-length = 100
target-version = "py313"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM"]
# RUF001/002/003: «двусмысленные» кириллические символы — шум на русскоязычном проекте.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
